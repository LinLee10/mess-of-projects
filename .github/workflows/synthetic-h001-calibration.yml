name: H001 full data calibration mechanism probe
on:
  push:
    branches: [research/synthetic-data-reviewed-20260911]
    paths:
      - '.github/workflows/synthetic-h001-calibration.yml'
      - 'synthetic-data-lab/research_control/units/H001/**'
permissions:
  contents: read
concurrency:
  group: synthetic-h001-calibration
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python synthetic-data-lab/research_control/units/H001/review/test_calibration.py
  experiment:
    needs: controls
    if: github.repository == 'LinLee10/mess-of-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [17, 29, 41]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0 lightgbm==4.6.0
      - name: Execute one complete data seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          python synthetic-data-lab/research_control/units/H001/src/run_h001.py --raw synthetic-data-lab/data/raw/covertype.zip --output evidence/run --seed '${{ matrix.seed }}' 2>&1 | tee evidence/execution.log
      - name: Independently verify saved experiment
        shell: bash
        run: |
          set -euo pipefail
          python synthetic-data-lab/research_control/units/H001/review/check_h001.py --run evidence/run --output evidence/AUDIT.json 2>&1 | tee evidence/audit.log
      - name: Record artifact digests and protocol
        if: always()
        run: |
          mkdir -p evidence
          cp synthetic-data-lab/research_control/units/H001/PROTOCOL.md evidence/
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path('evidence');(r/'RUN_ID.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA']},indent=2))
          files={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()}
          (r/'ARTIFACT_SHA256.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h001-seed-${{ matrix.seed }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          compression-level: 3
          retention-days: 90
          if-no-files-found: error
