name: Reviewed synthetic data CPU experiment
on:
  push:
    branches: [research/synthetic-data-reviewed-20260911]
    paths:
      - 'synthetic-data-lab/src/**'
      - 'synthetic-data-lab/tests/**'
      - 'synthetic-data-lab/scripts/**'
      - 'synthetic-data-lab/configs/**'
      - '.github/workflows/synthetic-data-reviewed.yml'
permissions:
  contents: write
concurrency:
  group: synthetic-data-reviewed-experiment
  cancel-in-progress: false
jobs:
  execute:
    if: github.repository == 'LinLee10/mess-of-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Test, train, evaluate and independently audit
        run: python synthetic-data-lab/scripts/run_ci.py
      - name: Commit new evidence on the research branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/synthetic-data-reviewed-20260911'
          stage="$RUNNER_TEMP/synthetic-evidence-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$stage"
          mv synthetic-data-lab/results synthetic-data-lab/models synthetic-data-lab/CI_EXECUTION.json synthetic-data-lab/ci_execution.log "$stage/"
          git fetch origin "$GITHUB_REF_NAME"
          git switch -C evidence-publication "origin/$GITHUB_REF_NAME"
          destination="synthetic-data-lab/ci_runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$destination"
          mkdir -p "$(dirname "$destination")"
          mv "$stage" "$destination"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$destination"
          git commit -m "Record independently audited CPU experiment ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "Evidence committed under $destination" >> "$GITHUB_STEP_SUMMARY"
      - name: Expose failure log
        if: failure()
        run: tail -n 100 synthetic-data-lab/ci_execution.log || true
