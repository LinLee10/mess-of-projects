name: Full data synthesis and adjacent domain experiments
on:
  push:
    branches: [research/synthetic-data-scale-v2]
    paths:
      - 'synthetic-data-lab/experiments/scale_v2/src/**'
      - 'synthetic-data-lab/experiments/scale_v2/review/**'
      - '.github/workflows/synthetic-data-scale-v2.yml'
permissions:
  contents: write
concurrency:
  group: synthetic-data-scale-v2
  cancel-in-progress: false
jobs:
  experiment:
    if: github.repository == 'LinLee10/mess-of-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        dataset: [wine_red, wine_white, dry_bean, sensorless]
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      DATASET: ${{ matrix.dataset }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Original tests and isolated scale contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/scale-evidence"
          cd synthetic-data-lab
          PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/scale-evidence/original-tests.log"
          python -m unittest discover -s review -p test_audit_v2.py -v 2>&1 | tee "$RUNNER_TEMP/scale-evidence/previous-checker-tests.log"
          PYTHONPATH=experiments/scale_v2/src:src python -m unittest discover -s experiments/scale_v2/review -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/scale-evidence/new-tests.log"
          PYTHONPATH=experiments/scale_v2/src:src python experiments/scale_v2/review/integration_canary.py 2>&1 | tee "$RUNNER_TEMP/scale-evidence/software-canary.log"
          git rev-parse HEAD > "$RUNNER_TEMP/scale-evidence/source-commit.txt"
      - name: Fit all permitted real rows and freeze every candidate
        shell: bash
        run: |
          set -euo pipefail
          cd synthetic-data-lab
          PYTHONPATH=experiments/scale_v2/src:src python experiments/scale_v2/src/fullscale.py train --dataset "$DATASET" --output "$RUNNER_TEMP/scale-evidence/run" --cache "$RUNNER_TEMP/scale-evidence/source_archives" 2>&1 | tee "$RUNNER_TEMP/scale-evidence/training.log"
      - name: Score every frozen test row
        shell: bash
        run: |
          set -euo pipefail
          cd synthetic-data-lab
          PYTHONPATH=experiments/scale_v2/src:src python experiments/scale_v2/src/fullscale.py evaluate --output "$RUNNER_TEMP/scale-evidence/run" 2>&1 | tee "$RUNNER_TEMP/scale-evidence/evaluation.log"
      - name: Recompute metrics and checkpoints in a separate checker process
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH='' python synthetic-data-lab/experiments/scale_v2/review/audit_scale.py --root "$RUNNER_TEMP/scale-evidence/run" --output "$RUNNER_TEMP/scale-evidence/AUDIT.json" 2>&1 | tee "$RUNNER_TEMP/scale-evidence/audit.log"
      - name: Retain complete evidence including partial failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scale-v2-${{ matrix.dataset }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/scale-evidence
          if-no-files-found: warn
          retention-days: 90
          compression-level: 1
      - name: Publish compact evidence without rewriting historical experiments
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/synthetic-data-scale-v2'
          stage="$RUNNER_TEMP/compact-${DATASET}"
          mkdir -p "$stage"
          for f in SUMMARY.json protocol.json environment.json CANDIDATES.json progress.json; do
            if test -f "$RUNNER_TEMP/scale-evidence/run/$f"; then cp "$RUNNER_TEMP/scale-evidence/run/$f" "$stage/"; fi
          done
          for f in AUDIT.json source-commit.txt original-tests.log previous-checker-tests.log new-tests.log training.log evaluation.log audit.log; do
            if test -f "$RUNNER_TEMP/scale-evidence/$f"; then cp "$RUNNER_TEMP/scale-evidence/$f" "$stage/"; fi
          done
          if test -d "$RUNNER_TEMP/scale-evidence/run/data"; then
            mkdir -p "$stage/source_metadata"
            for f in "$RUNNER_TEMP/scale-evidence/run/data/"*/source.json; do
              cp "$f" "$stage/source_metadata/$(basename "$(dirname "$f")").json"
            done
          fi
          printf '%s\n' "Full tensors, models, source archives and predictions: Actions artifact scale-v2-${DATASET}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}. Retained for 90 days. Absence of AUDIT.json is not a passing audit." > "$stage/ARTIFACT.txt"
          git fetch origin "$GITHUB_REF_NAME"
          git switch -C scale-evidence-publication "origin/$GITHUB_REF_NAME"
          destination="synthetic-data-lab/experiments/scale_v2/results/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/${DATASET}"
          test ! -e "$destination"
          mkdir -p "$(dirname "$destination")"
          cp -R "$stage" "$destination"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- "$destination"
          git commit -m "Record full data ${DATASET} experiment ${GITHUB_RUN_ID}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"; then
              echo "Evidence: $destination" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          exit 1
