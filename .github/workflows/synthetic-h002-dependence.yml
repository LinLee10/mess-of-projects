name: H002 conditional marginal locked dependence
on:
  push:
    branches: [research/synthetic-data-reviewed-20260911]
    paths: ['synthetic-data-lab/research_control/units/H002/**', '.github/workflows/synthetic-h002-dependence.yml']
permissions:
  contents: read
  actions: read
jobs:
  controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - run: python synthetic-data-lab/research_control/units/H002/review/test_rank_synthesis.py
  experiment:
    needs: controls
    if: github.repository == 'LinLee10/mess-of-projects'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [17,29,41]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: h001-seed-17-35264679818-1
          run-id: 35264679818
          github-token: ${{ github.token }}
          path: input_evidence
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: b002-seed17-35270306642-1
          run-id: 35270306642
          github-token: ${{ github.token }}
          path: baseline_evidence
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0 lightgbm==4.6.0
      - name: Run four full table comparisons
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          python -m pip freeze > evidence/dependencies.txt
          python synthetic-data-lab/research_control/units/H002/src/run_h002.py --input input_evidence --baseline baseline_evidence --output evidence/run --support synthetic-data-lab/research_control --seed ${{ matrix.seed }} 2>&1 | tee evidence/execution.log
      - name: Independent full table verification
        shell: bash
        run: |
          set -euo pipefail
          python synthetic-data-lab/research_control/units/H002/review/check_h002.py --input input_evidence --baseline baseline_evidence --run evidence/run --support synthetic-data-lab/research_control --seed ${{ matrix.seed }} --output evidence/AUDIT.json 2>&1 | tee evidence/audit.log
      - name: Seal successful or partial evidence
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp -r synthetic-data-lab/research_control/units/H002 evidence/source
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          p=Path('evidence')
          (p/'RUN.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']},indent=2)+'\n')
          hashes={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob('*')) if f.is_file()}
          (p/'ARTIFACT_SHA256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h002-seed-${{ matrix.seed }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error
