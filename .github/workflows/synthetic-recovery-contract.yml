name: Synthetic recovery contract acceptance
on:
  push:
    branches:
      - audit/recovery-contract-20261030
      - research/synthetic-data-reviewed-20260911
    paths:
      - synthetic-data-lab/research_control/units/H003R/review/recover_artifact.py
      - synthetic-data-lab/research_control/units/H003R/review/test_recovery.py
      - review_acceptance/**
      - .github/workflows/synthetic-recovery-contract.yml
permissions:
  contents: read
jobs:
  recovery-contract:
    if: github.repository == 'LinLee10/mess-of-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependency
        run: python -m pip install pytest==9.0.2
      - name: Run protected recovery acceptance
        run: python review_acceptance/run_recovery_gate.py --output "$RUNNER_TEMP/recovery-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: recovery-contract-${{ matrix.python }}-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-evidence/
          retention-days: 90
          if-no-files-found: error
