name: B002 full data contextual Gaussian reference
on:
  push:
    branches: [research/synthetic-data-reviewed-20260911]
    paths: ['synthetic-data-lab/research_control/units/B002/**', '.github/workflows/synthetic-b002-reference.yml']
permissions:
  contents: read
  actions: read
jobs:
  reference:
    if: github.repository == 'LinLee10/mess-of-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: h001-seed-17-35264679818-1
          run-id: 35264679818
          github-token: ${{ github.token }}
          path: input_evidence
      - name: Install recorded CPU libraries
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pandas==2.2.3 scikit-learn==1.8.0 lightgbm==4.6.0
      - name: Preserve calibration controls and test copula contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          python synthetic-data-lab/research_control/units/H001/review/test_calibration.py 2>&1 | tee evidence/existing_tests.log
          python synthetic-data-lab/research_control/units/B002/review/test_copula.py 2>&1 | tee evidence/copula_tests.log
      - name: Fit one complete dataset reference
        shell: bash
        run: |
          set -euo pipefail
          python synthetic-data-lab/research_control/units/B002/src/run.py --input input_evidence --output evidence/run --support synthetic-data-lab/research_control --seed 17 2>&1 | tee evidence/execution.log
      - name: Independently reconstruct and check full data outputs
        shell: bash
        run: |
          set -euo pipefail
          python synthetic-data-lab/research_control/units/B002/review/check.py --input input_evidence --run evidence/run --support synthetic-data-lab/research_control --seed 17 --output evidence/AUDIT.json 2>&1 | tee evidence/audit.log
      - name: Retain source and seal successful or partial outputs
        if: always()
        shell: bash
        run: |
          mkdir -p evidence
          cp -r synthetic-data-lab/research_control/units/B002 evidence/source
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path('evidence')
          (p/'RUN.json').write_text(json.dumps({'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']},indent=2)+'\n')
          hashes={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob('*')) if f.is_file()}
          (p/'ARTIFACT_SHA256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b002-seed17-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 90
          if-no-files-found: error
