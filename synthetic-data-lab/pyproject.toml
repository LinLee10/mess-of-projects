[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthlab-next"
version = "0.1.0"
description = "Auditable executed synthetic tabular data research extension"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.5", "torch>=2.1"]

[project.scripts]
synthlab-next = "synthlab_next.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
report = ["reportlab>=4.0"]
