name: H001C independent linear student challenge
on:
  push:
    branches: [research/synthetic-data-reviewed-20260911]
    paths:
      - '.github/workflows/synthetic-h001c-linear.yml'
      - 'synthetic-data-lab/research_control/units/H001C/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: synthetic-h001c-linear
  cancel-in-progress: false
jobs:
  linear:
    if: github.repository == 'LinLee10/mess-of-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [17, 29, 41]
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: h001-seed-${{ matrix.seed }}-35264679818-1
          run-id: 35264679818
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: prior_evidence
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Verify checker controls before any fit
        run: python -m unittest discover -s synthetic-data-lab/research_control/units/H001C/review -p test_second_learner.py -v
      - name: Fit complete linear comparisons
        shell: bash
        run: |
          set -euo pipefail
          mkdir linear_evidence
          python synthetic-data-lab/research_control/units/H001C/src/second_learner.py --input prior_evidence --output linear_evidence/run 2>&1 | tee linear_evidence/execution.log
      - name: Check independent inference and metrics
        run: python synthetic-data-lab/research_control/units/H001C/review/check_second_learner.py --input prior_evidence --run linear_evidence/run --output linear_evidence/AUDIT.json
      - name: Seal evidence
        if: always()
        run: |
          mkdir -p linear_evidence
          cp -R synthetic-data-lab/research_control/units/H001C linear_evidence/source
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          r=Path('linear_evidence');(r/'RUN.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA'],'input_run_id':35264679818},indent=2))
          files={str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(r.rglob('*')) if p.is_file()}
          (r/'ARTIFACT_SHA256.json').write_text(json.dumps(files,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h001c-linear-${{ matrix.seed }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: linear_evidence/
          retention-days: 90
          if-no-files-found: error
