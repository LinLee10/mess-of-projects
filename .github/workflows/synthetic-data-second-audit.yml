name: Separate synthetic data artifact review
on:
  push:
    branches: [research/synthetic-data-reviewed-20260911]
    paths:
      - 'synthetic-data-lab/review/audit_v2.py'
      - 'synthetic-data-lab/review/test_audit_v2.py'
      - '.github/workflows/synthetic-data-second-audit.yml'
permissions:
  contents: write
concurrency:
  group: synthetic-data-artifact-review
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'LinLee10/mess-of-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install recorded CPU dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0
      - name: Verify existing contracts and separate checker controls
        shell: bash
        run: |
          set -euo pipefail
          cd synthetic-data-lab
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m unittest discover -s review -p test_audit_v2.py -v
      - name: Independently recompute the published experiment
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/second-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir "$out"
          python synthetic-data-lab/review/audit_v2.py \
            --run synthetic-data-lab/ci_runs/34658103152-1/results/pilot_v1 \
            --output "$out/report.json" | tee "$out/audit.log"
          printf '%s\n' "$GITHUB_SHA" > "$out/checker_commit.txt"
          printf '%s\n' '89eb2a73b64b3b829b84f1011fd0ce700f2aa6a9' > "$out/evidence_commit.txt"
      - name: Publish review evidence without modifying experiment artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'research/synthetic-data-reviewed-20260911'
          out="$RUNNER_TEMP/second-audit-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch origin "$GITHUB_REF_NAME"
          git switch -C audit-publication "origin/$GITHUB_REF_NAME"
          destination="synthetic-data-lab/review/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$destination"
          mkdir -p "$(dirname "$destination")"
          cp -R "$out" "$destination"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$destination"
          git commit -m "Record separate artifact review ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
          echo "Verified review evidence: $destination" >> "$GITHUB_STEP_SUMMARY"
